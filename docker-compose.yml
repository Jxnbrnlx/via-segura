# VÍA SEGURA con PostgreSQL. Uso (ver README.md):
#   1) Copie .env.docker.example a .env.docker y cambie las contraseñas.
#   2) docker compose --env-file .env.docker up -d --build
#   3) Abra http://localhost:8000/
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: viasegura
      POSTGRES_USER: viasegura
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD en .env.docker}
    volumes:
      - datos_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U viasegura -d viasegura"]
      interval: 5s
      timeout: 5s
      retries: 20
    # Sin "ports": la base de datos no queda expuesta fuera de Docker.

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ENTORNO: produccion
      DATABASE_URL: postgresql+psycopg://viasegura:${POSTGRES_PASSWORD}@db:5432/viasegura
      SECRET_KEY: ${SECRET_KEY:?Defina SECRET_KEY en .env.docker (al menos 32 caracteres)}
      CORS_ORIGENES: ${CORS_ORIGENES:-http://localhost:8000,http://127.0.0.1:8000}
      CARGAR_DEMO: ${CARGAR_DEMO:-0}
      ADMIN_CORREO: ${ADMIN_CORREO:-}
      ADMIN_CONTRASENA: ${ADMIN_CONTRASENA:-}
      CARGA_DIRECTORIO: /app/backend/app/data/cargas
      GEO_DIRECTORIO: /app/backend/app/data/geo
    volumes:
      - cargas:/app/backend/app/data/cargas
      - geo:/app/backend/app/data/geo
    ports:
      - "${PUERTO:-8000}:8000"

volumes:
  datos_postgres:
  cargas:
  geo:
